[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/grupo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

# Mantém públicos os links já compartilhados antes da reorganização.
[[redirects]]
  from = "/grupo/pilulas/lesoes-meniscais/*"
  to = "/artigos/lesoes-meniscais/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/grupo/pilulas/instabilidade-lateral-tornozelo/*"
  to = "/artigos/instabilidade-lateral-tornozelo/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/grupo/pilulas/lesao-vertebral-hipointensa-t1/*"
  to = "/artigos/lesao-vertebral-hipointensa-t1/:splat"
  status = 301
  force = true


# Preserva os links públicos já enviados antes da nova categoria.
[[redirects]]
  from = "/resumos/lesoes-meniscais/*"
  to = "/artigos/lesoes-meniscais/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/resumos/instabilidade-lateral-tornozelo/*"
  to = "/artigos/instabilidade-lateral-tornozelo/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/resumos/lesao-vertebral-hipointensa-t1/*"
  to = "/artigos/lesao-vertebral-hipointensa-t1/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/grupo/*"
  to = "/grupo/:splat"
  status = 200
  force = true
  conditions = {Role = ["medico"]}

[[redirects]]
  from = "/grupo/*"
  to = "/acesso/?next=/grupo/:splat"
  status = 302
  force = true
